_schema-version: 3.3.0
ID: dispatcher-app
version: 1.0.0

description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p gen/srv/db/data
        - sh -c "cp db/data/*.csv gen/srv/db/data/"
        - npx cds deploy --to sqlite:gen/srv/dispatcher.db

modules:
  - name: dispatcher-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  - name: dispatcher-app-ui
    type: approuter.nodejs
    
    path: app/dispatcher
    parameters:
      disk-quota: 512M
      memory: 128M
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: .
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: false

resources: []
