_schema-version: 3.3.0
ID: dispatcher-app
version: 1.0.0

description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: dispatcher-app-db
    type: nodejs
    path: gen/pg
    parameters:
      no-route: true
      no-start: true
      memory: 256M
      disk-quota: 512M
      tasks:
        - name: deploy
          command: npx cds-deploy
          memory: 256M
          disk-quota: 512M
    requires:
      - name: dispatcher-postgres

  - name: dispatcher-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    deployed-after:
      - dispatcher-app-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: dispatcher-postgres

  - name: dispatcher-app-ui
    type: approuter.nodejs
    
    path: app/dispatcher
    parameters:
      disk-quota: 512M
      memory: 128M
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: .
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: false

resources:
  - name: dispatcher-postgres
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: postgresql-db
